name: Desktop apps

# Builds Fire at Will (fire-at-will.html) and Fire at Will Testing (fire-at-will-testing.html) as Windows, Mac
# and Linux apps and puts the installers on the "desktop" release, replacing the old ones.
on:
  push:
    branches: [main]
    paths:
      - fire-at-will.html
      - fire-at-will-testing.html
      - scripts/make-testing.js
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node ../scripts/make-testing.js
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: npx electron-builder ${{ matrix.target }} --publish never --config testing.config.js
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            desktop/dist/Fire-at-Will-*.exe
            desktop/dist/Fire-at-Will-*.dmg
            desktop/dist/Fire-at-Will-*.AppImage
            desktop/dist/Fire-at-Will-*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Replace the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete desktop --cleanup-tag --yes || true
          gh release create desktop out/* \
            --target "$GITHUB_SHA" \
            --title "Fire at Will desktop apps" \
            --notes "Built from fire-at-will.html at ${GITHUB_SHA::7}. Windows: Fire-at-Will-Setup.exe (installer) or Fire-at-Will-Portable.exe (no install). Mac: Fire-at-Will-Mac.dmg (Intel and Apple Silicon). Linux: Fire-at-Will-Linux.AppImage or Fire-at-Will-Linux.deb. The Fire at Will Testing app (Test a level, Sandbox, Enemy tester) has the same files with Testing in the name, for example Fire-at-Will-Testing-Mac.dmg."
